name: Validate Quantitative Focused Practice
on:
  push:
    paths:
      - 'index.html'
      - 'sections/quantitative/**'
      - 'tests/validate-quantitative-practice.js'
      - '.github/workflows/validate-quantitative-practice.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'sections/quantitative/**'
      - 'tests/validate-quantitative-practice.js'
      - '.github/workflows/validate-quantitative-practice.yml'
jobs:
  validate-focused-practice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all Quantitative practice papers and integration
        run: node tests/validate-quantitative-practice.js
