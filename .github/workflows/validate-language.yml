name: Validate HSPT Language Question Banks
on:
  push:
    paths:
      - 'sections/language/data/language-papers-v2.json'
      - 'sections/language/data/language-20day-curriculum-spelling.json'
      - 'sections/language/data/language-hspt-book-spelling.json'
      - 'tests/validate-language-papers.js'
      - '.github/workflows/validate-language.yml'
  pull_request:
    paths:
      - 'sections/language/data/language-papers-v2.json'
      - 'sections/language/data/language-20day-curriculum-spelling.json'
      - 'sections/language/data/language-hspt-book-spelling.json'
      - 'tests/validate-language-papers.js'
jobs:
  check-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 20 full papers and spelling coverage
        run: node tests/validate-language-papers.js
